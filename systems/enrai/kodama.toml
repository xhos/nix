listen = "0.0.0.0:7777"
data_dir = "/var/lib/kodama"

[[ladder]]
name = "pro"
base_url = "http://127.0.0.1:8317/v1"
api_key_env = "CLIPROXY_KEY"
model = "gemini-3.8-flash-high"
max_tokens = 8192

[[ladder]]
name = "sonnet"
base_url = "http://127.0.0.1:8317/v1"
api_key_env = "CLIPROXY_KEY"
model = "claude-sonnet-4-6"
max_tokens = 8192

[[mcp]]
name = "ha"
url = "http://127.0.0.1:8123/api/mcp"
transport = "http"
token_env = "HA_TOKEN"
lazy = true
about = "Home Assistant: every light, the heating, the apartment's speakers and TV, sensors. Everything in the apartment that is not a computer."

[permissions]
confirm = ["shell", "ha_HassMediaPlay*", "ha_*Lock*", "ha_*Alarm*"]
event_deny = ["pc"]

[history]
max_messages = 120
keep_recent = 40
image_turns = 3

[escalation]
max_iters = 12
max_tool_errors = 3
top_retries = 4
top_retry_delay_seconds = 15
