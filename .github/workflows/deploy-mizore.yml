name: Deploy mizore

on:
  repository_dispatch:
    types: [deploy-mizore]
  workflow_dispatch:

concurrency:
  group: deploy-mizore
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.xhos.dev/main
            extra-trusted-public-keys = main:sD+aH0XOgkp432O05lkkl1x7XipgELXk+1mQmuDch0U=
            accept-flake-config = true
            http-connections = 128
            download-buffer-size = 536870912
            max-substitution-jobs = 32

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Update nagomi flake input
        run: |
          nix flake update nagomi
          if ! git diff --quiet flake.lock; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add flake.lock
            git commit -m "update nagomi"
            git push
          fi

      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: "--login-server https://hs.xhos.dev --accept-dns"
          version: "1.102.4"
          targets: 100.64.0.13 # systems/mizore/configuration.nix

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          NIX_SECRETS_SSH_KEY: ${{ secrets.NIX_SECRETS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_mizore
          printf '%s\n' "$NIX_SECRETS_SSH_KEY" > ~/.ssh/nix_secrets
          chmod 600 ~/.ssh/deploy_mizore ~/.ssh/nix_secrets
          cat >> ~/.ssh/config <<EOF
          Host mizore.ts.xhos.dev
            HostName 100.64.0.13
            User deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/deploy_mizore
          Host github.com
            IdentityFile ~/.ssh/nix_secrets
          EOF
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build system closure
        run: nix build .#nixosConfigurations.mizore.config.system.build.toplevel

      - name: Push to cache
        continue-on-error: true
        run: |
          nix run github:zhaofengli/attic#attic -- \
            login ci https://cache.xhos.dev "${{ secrets.ATTIC_TOKEN }}"
          nix run github:zhaofengli/attic#attic -- push main ./result

      - name: Clear stale switch-to-configuration unit
        run: |
          ssh deploy@mizore.ts.xhos.dev "
            sudo systemctl stop nixos-rebuild-switch-to-configuration.service 2>/dev/null || true
            sudo systemctl reset-failed nixos-rebuild-switch-to-configuration.service 2>/dev/null || true
          "

      - name: Deploy
        run: |
          nix run nixpkgs#nixos-rebuild -- switch \
            --flake .#mizore \
            --target-host deploy@mizore.ts.xhos.dev \
            --sudo \
            --fallback
